[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hc-btc-macro-integration-study"
version = "0.3.0"
description = "HilmarCorp — Bitcoin Macro Integration Study"
license = "Apache-2.0"
requires-python = ">=3.12,<3.13"

dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15.0",
    "requests>=2.31",
    "PyYAML>=6.0",
    "yfinance>=0.2.40",
    "pandas-market-calendars>=4.4",
    "statsmodels>=0.14",
    "scipy>=1.12",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-xdist>=3.6",
    "pytest-socket>=0.7",
    "pytest-timeout>=2.3",
    "pytest-randomly>=3.15",
    "hypothesis>=6.100",
    "ruff>=0.12",
    "pyright>=1.1.400",
    "pandas-stubs==3.0.5.260730",
    "scipy-stubs==1.18.1.0",
    "pip-audit>=2.7",
]

[project.scripts]
hc-macro = "hc_macro_integration.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-config",
    "--strict-markers",
    "--disable-socket",
    "--timeout=60",
    "--randomly-seed=20260906",
]
markers = [
    "integration: integration tests against frozen local artifacts",
    "regression: regression tests locking certified research results",
    "slow: computationally expensive tests",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.coverage.run]
branch = true
source = ["hc_macro_integration"]

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.pyright]
include = ["src"]
exclude = ["**/__pycache__"]
pythonVersion = "3.12"
typeCheckingMode = "basic"
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportUnknownArgumentType = false
reportUnknownVariableType = false
reportUnknownLambdaType = false

